name: Taski CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - LICENSE

jobs:
  backend_tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run backend tests
        env:
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: db.sqlite3
          SECRET_KEY: test-secret-key-12345
        run: |
          cd backend
          python manage.py test


  frontend_tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend tests
        run: |
          cd frontend
          npm run test


  build_backend:
    runs-on: ubuntu-latest
    needs: backend_tests

    steps:
      - uses: actions/checkout@v3

      - uses: docker/setup-buildx-action@v2

      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/taski_backend:latest


  build_frontend:
    runs-on: ubuntu-latest
    needs: frontend_tests

    steps:
      - uses: actions/checkout@v3

      - uses: docker/setup-buildx-action@v2

      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/taski_frontend:latest


  build_gateway:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: docker/setup-buildx-action@v2

      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v4
        with:
          context: ./gateway
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/taski_gateway:latest


  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_backend
      - build_frontend
      - build_gateway

    steps:
      - uses: actions/checkout@v3

      - name: Test SSH connection
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "SSH connection successful"

      - name: Copy docker-compose.production.yml
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSH_KEY }}
          source: docker-compose.production.yml
          target: taski

      - name: Deploy on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "Starting deployment..."
            echo "Current directory: $(pwd)"
            echo "Listing files in taski directory:"
            ls -la ~/taski/
            
            echo "Checking if docker-compose.production.yml exists..."
            if [ -f ~/taski/docker-compose.production.yml ]; then
              echo "File exists"
            else
              echo "File not found!"
              exit 1
            fi
            
            cd ~/taski
            echo "Pulling new images..."
            sudo docker compose -f docker-compose.production.yml pull
            
            echo "Stopping old containers..."
            sudo docker compose -f docker-compose.production.yml down
            
            echo "Starting new containers..."
            sudo docker compose -f docker-compose.production.yml up -d
            
            echo "Waiting for containers to start..."
            sleep 10
            
            echo "Checking container status..."
            sudo docker compose -f docker-compose.production.yml ps
            
            echo "Running migrations..."
            sudo docker compose -f docker-compose.production.yml exec backend python manage.py migrate
            
            echo "Collecting static files..."
            sudo docker compose -f docker-compose.production.yml exec backend python manage.py collectstatic --no-input
            
            echo "Deployment completed successfully!"


  notify:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Taski успешно задеплоен!
            Репозиторий: ${{ github.repository }}
            Коммит: ${{ github.sha }}
            Время: $(date)

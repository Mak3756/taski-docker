version: '3.9'

volumes:
  postgres_data:
  static_volume:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  backend:
    image: mak37/taski_backend:latest
    env_file: .env
    volumes:
      - static_volume:/backend_static
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "pgrep", "gunicorn"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: mak37/taski_frontend:latest
    volumes:
      - static_volume:/staticfiles
    command: sh -c "cp -r /app/build/. /staticfiles/ && tail -f /dev/null"

  gateway:
    image: mak37/taski_gateway:latest
    restart: always
    ports:
      - "8080:80"
    volumes:
      - static_volume:/staticfiles
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

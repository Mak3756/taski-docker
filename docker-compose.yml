version: '3.9'

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: mak37/taski_backend:latest
    env_file: .env
    depends_on:
      - db
    volumes:
      - static:/app/static
      - media:/app/media

  frontend:
    image: mak37/taski_frontend:latest
    volumes:
      - static:/app/static
    command: sh -c "cp -r /app/build/. /app/static/"

  gateway:
    image: mak37/taski_gateway:latest
    depends_on:
      - backend
      - frontend
    ports:
      - "8000:80"
    volumes:
      - static:/static
      - media:/media

volumes:
  static:
  media:
  pg_data:

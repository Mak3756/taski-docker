version: '3.9'

volumes:
  postgres_data:
  static_volume:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  backend:
    image: mak37/taski_backend:latest
    env_file: .env
    volumes:
      - static_volume:/app/collected_static
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: mak37/taski_frontend:latest
    volumes:
      - static_volume:/staticfiles
    command: sh -c "cp -r /app/build/. /staticfiles/ && chmod -R 755 /staticfiles/ && tail -f /dev/null"

  gateway:
    image: mak37/taski_gateway:latest
    restart: always
    ports:
      - "8000:80"
    volumes:
      - static_volume:/staticfiles
    depends_on:
      - backend
      - frontend

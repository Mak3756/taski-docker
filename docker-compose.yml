version: '3.9'

volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: mak37/taski_backend:latest
    env_file: .env
    depends_on:
      - db
    volumes:
      - static:/static
      - media:/media

  frontend:
    image: mak37/taski_frontend:latest
    command: sh -c "cp -r /app/build/. /static/"
    volumes:
      - static:/static

  gateway:
    image: mak37/taski_gateway:latest
    ports:
      - "8000:80"
    volumes:
      - static:/static
      - media:/media

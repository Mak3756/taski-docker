volumes:
  static:
  media:
  pg_data:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: mak37/taski_backend:latest
    env_file: .env
    volumes:
      - static:/backend_static
      - media:/backend_media
    depends_on:
      - db

  frontend:
    image: mak37/taski_frontend:latest
    command: sh -c "cp -r /app/build/. /static/ && exit 0"
    volumes:
      - static:/static
    depends_on:
      - backend

  gateway:
    image: mak37/taski_gateway:latest
    ports:
      - "8080:80"
    volumes:
      - static:/static:ro
      - media:/media
    depends_on:
      - frontend
      - backend

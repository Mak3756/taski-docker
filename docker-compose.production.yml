version: '3.8'

volumes:
  taski_pg_data:
  taski_static_volume:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - taski_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: mak37/taski_backend:latest
    env_file: .env
    volumes:
      - taski_static_volume:/backend_static
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: mak37/taski_frontend:latest
    volumes:
      - taski_static_volume:/frontend_static
    command: sh -c "cp -r /app/build/. /frontend_static/ && chmod -R 755 /frontend_static/"

  gateway:
    image: mak37/taski_gateway:latest 
    volumes:
      - taski_static_volume:/staticfiles
    ports:
      - "8000:80"
    depends_on:
      backend:
        condition: service_healthy

version: '3'

volumes:
  pg_data_production:
  static_volume:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data

  backend:
    image: mak37/taski_backend:latest
    env_file: .env
    depends_on:
      - db
    volumes:
      - static_volume:/backend_static
    command: gunicorn backend.wsgi:application --bind 0.0.0.0:8000

  frontend:
    image: mak37/taski_frontend:latest
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_volume:/frontend_static

  gateway:
    image: mak37/taski_gateway:latest
    depends_on:
      - backend
      - frontend
    volumes:
      - static_volume:/staticfiles/
    ports:
      - "8080:80"

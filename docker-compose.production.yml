version: '3.8'

volumes:
  taski_static:
  taski_media:
  taski_pg_data:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - taski_pg_data:/var/lib/postgresql/data

  backend:
    image: mak37/taski_backend:latest
    env_file: .env
    volumes:
      - taski_static:/backend_static
      - taski_media:/app/media
    depends_on:
      - db

  frontend:
    image: mak37/taski_frontend:latest
    volumes:
      - taski_static:/frontend_static
    command: cp -r /app/build/. /frontend_static/

  gateway:
    image: mak37/taski_gateway:latest
    volumes:
      - taski_static:/staticfiles
      - taski_media:/media
    ports:
      - "8000:80"
    depends_on:
      - backend

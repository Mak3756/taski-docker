volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  
  backend:
    image: mak37/taski_backend:latest
    env_file: .env
    depends_on:
      - db
    volumes:
      - static:/staticfiles
      - media:/staticfiles/media
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn backend.wsgi:application --bind 0.0.0.0:8000"
    
  frontend:
    image: mak37/taski_frontend:latest
    volumes:
      - static:/staticfiles
    command: sh -c "mkdir -p /staticfiles && cp -r /app/build/. /staticfiles/"
    
  gateway:
    image: mak37/taski_gateway:latest
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:80"
    volumes:
      - static:/staticfiles
      - media:/staticfiles/media

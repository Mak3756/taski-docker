version: '3'

volumes:
  pg_data:
  static:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: mak37/taski_backend
    env_file: .env
    depends_on:
      - db
    volumes:
      - static:/backend_static
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn backend.wsgi:application --bind 0.0.0.0:8000"

  frontend:
    image: mak37/taski_frontend
    volumes:
      - static:/frontend_static

  gateway:
    image: mak37/taski_gateway
    volumes:
      - static:/staticfiles
    ports:
      - "80:80"

volumes:
  static:
  media:
  pg_data:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: mak37/taski_backend:latest
    env_file: .env
    depends_on:
      - db
    volumes:
      - static:/backend_static
      - media:/backend_media

  frontend:
    image: mak37/taski_frontend:latest
    command: cp -r /app/build/. /staticfiles/
    volumes:
      - static:/staticfiles
    restart: "no"

  gateway:
    image: mak37/taski_gateway:latest
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:80"
    volumes:
      - static:/staticfiles
      - media:/media

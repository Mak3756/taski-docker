version: '3.9'

volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: mak37/taski_backend:latest
    env_file: .env
    depends_on:
      - db
    volumes:
      - static:/backend_static
      - media:/backend_media

  frontend:
    image: mak37/taski_frontend:latest
    volumes:
      - static:/static
    command: sh -c "cp -r /app/build/. /static/"

  gateway:
    build: ./gateway
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:80"
    volumes:
      - static:/static

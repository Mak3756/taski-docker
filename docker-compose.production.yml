version: '3.8'

volumes:
  static:
  media:
  pg_data:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

  backend:
    image: mak37/taski_backend:latest
    env_file: .env
    depends_on:
      - db
    volumes:
      - static:/backend_static
      - media:/app/media
    restart: always

  frontend:
    image: mak37/taski_frontend:latest
    volumes:
      - static:/staticfiles
    command: sh -c "cp -r /app/build/. /staticfiles/"

  gateway:
    image: mak37/taski_gateway:latest
    depends_on:
      - backend
      - frontend
    volumes:
      - static:/staticfiles:ro
      - media:/media
    ports:
      - "8080:80"
    restart: always

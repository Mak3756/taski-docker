volumes:
  static:
  media:
  pg_data:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: mak37/taski_backend:latest
    env_file: .env
    volumes:
      - static:/backend_static
      - media:/media
    depends_on:
      - db

  frontend:
    image: mak37/taski_frontend:latest
    volumes:
      - static:/static
    command: sh -c "cp -r /app/build/. /static/"

  gateway:
    image: mak37/taski_gateway:latest
    volumes:
      - static:/static
      - media:/media
    ports:
      - "8080:80"
    depends_on:
      - backend

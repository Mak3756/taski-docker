volumes:
  static_volume:
  media_volume:
  pg_data:

services:
  db:
    image: postgres:13
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: mak37/taski_backend:latest
    env_file: .env
    volumes:
      - static_volume:/app/collected_static
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: mak37/taski_frontend:latest
    volumes:
      - static_volume:/usr/share/nginx/html
    command: >
      sh -c "
      echo 'Копируем файлы фронтенда...' &&
      cp -r /app/build/. /usr/share/nginx/html/ &&
      chmod -R 755 /usr/share/nginx/html/ &&
      echo 'Файлы скопированы' &&
      tail -f /dev/null
      "
    depends_on:
      - backend

  gateway:
    image: mak37/taski_gateway:latest
    ports:
      - "8000:80"
    volumes:
      - static_volume:/usr/share/nginx/html:ro
      - media_volume:/media
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped

version: '3'

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: mak37/taski_backend:latest
    env_file: .env
    volumes:
      - static:/staticfiles
    command: >
      sh -c "
      python manage.py collectstatic --noinput &&
      gunicorn backend.wsgi:application --bind 0.0.0.0:8000
      "

  frontend:
    image: mak37/taski_frontend:latest
    volumes:
      - static:/staticfiles

  gateway:
    image: mak37/taski_gateway:latest
    volumes:
      - static:/staticfiles
    ports:
      - "8000:80"

volumes:
  pg_data:
  static:

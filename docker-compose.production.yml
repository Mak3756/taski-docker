version: '3.8'

volumes:
  static_volume:
  media_volume:
  pg_data:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  backend:
    image: mak37/taski_backend:latest
    env_file: .env
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - db

  frontend:
    image: mak37/taski_frontend:latest
    command: sh -c "cp -r /app/build/. /app/static/ && tail -f /dev/null"
    volumes:
      - static_volume:/app/static
    depends_on:
      - backend

  gateway:
    image: mak37/taski_gateway:latest
    ports:
      - "8000:80"
    volumes:
      - static_volume:/static:ro
      - media_volume:/media
    depends_on:
      - frontend
      - backend

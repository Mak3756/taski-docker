server {
    listen 80;
    server_name tonali.mooo.com;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /media/ {
        alias /media/;
    }

    location / {
        default_type text/html;
        return 200 "<html><body><h1>Taski is running</h1></body></html>";
    }
}

server {
    listen 80;
    
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://backend:8000/api/;
    }
    
    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://backend:8000/admin/;
    }
    
    location /static/ {
        alias /staticfiles/;
        try_files $uri =404;
    }
    
    location /media/ {
        alias /staticfiles/media/;
    }
    
    location / {
        root /staticfiles;
        index index.html;
        try_files $uri $uri/ /index.html =404;
    }
}

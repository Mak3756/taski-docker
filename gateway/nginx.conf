resolver 127.0.0.11;

server {
    listen 80;
    server_name tonali.mooo.com;
    index index.html;

    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://backend:8000/api/;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://backend:8000/admin/;
    }

    location /static/ {
        alias /static/;
    }

    location / {
        alias /static/;
        try_files $uri $uri/ /index.html;
    }
}

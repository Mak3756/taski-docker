server {
    listen 80;
    server_name tonali.mooo.com;

    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://backend:8000/api/;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://backend:8000/admin/;
    }

    location /static/ {
        alias /static/;
        try_files $uri =404;
    }

    location /media/ {
        alias /media/;
    }

    location / {
        alias /static/;
        try_files $uri /index.html;
    }
}
